name: Thesis checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Validate workspace
        run: python scripts/check_workspace.py
      - name: Check analysis and workflow safeguards
        run: python -m unittest discover -s code/tests
      - name: Require PR progress records
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_workspace.py --base "$BASE_SHA"
      - name: Reproduce archived timing arithmetic
        run: python code/analysis/replay_timing.py
  paper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paper
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the changes PDF needs the pull request's base commit
      - name: Install TeX toolchain
        run: sudo apt-get update && sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra texlive-science texlive-plain-generic cm-super biber latexdiff
      - name: Compile manuscript
        run: latexmk -Werror
      - uses: actions/upload-artifact@v4
        with:
          name: thesis-papers
          path: paper/build/main.pdf
      # Every branch except main: the manuscript with every change since main
      # (or the pull request's base) marked: removed text red and struck
      # through, new text blue. A review aid, so a failure here does not fail
      # the check. Runs for both the push and the pull_request event, so the
      # PDF is there whichever run a reviewer opens.
      - name: Build changes PDF
        id: changes
        if: github.ref != 'refs/heads/main'
        continue-on-error: true
        run: ../scripts/build_changes_pdf.sh "${{ github.event.pull_request.base.sha || 'origin/main' }}"
      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/main' && steps.changes.outcome == 'success'
        with:
          name: changes-vs-main
          path: paper/build/changes.pdf
      - name: Describe the PDFs
        if: always()
        run: |
          {
            echo "## Paper PDFs"
            echo "Download from **Artifacts** at the bottom of this page:"
            echo "- **thesis-papers**: main.pdf, the manuscript as it would be after merging."
            if [ "${{ steps.changes.outcome }}" = "success" ]; then
              echo "- **changes-vs-main**: changes.pdf, the same manuscript with this branch's changes marked (removed text red and struck through, new text blue)."
            elif [ "${{ github.ref }}" != "refs/heads/main" ]; then
              echo "- The changes PDF could not be built this time; review main.pdf and the file diff instead."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
